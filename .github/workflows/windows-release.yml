name: Windows EXE Release

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(tr -d '[:space:]' < VERSION)"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy

      - name: Verify Python sources and generate Windows metadata
        shell: pwsh
        run: |
          python -m compileall tools scripts
          python scripts/generate_version_info.py --version "${{ steps.version.outputs.version }}" --output branding/version_info.txt

      - name: Build one-file Windows EXE
        shell: pwsh
        run: |
          ./tools/build-standalone.ps1 -PythonExe python -DistDir dist -OneFile:$true -Windowed:$true -BundleBms:$true -VersionFile branding/version_info.txt

      - name: Verify and package EXE output
        shell: pwsh
        run: |
          if (!(Test-Path "dist/BZGoldExtractor.exe" -PathType Leaf)) {
            throw "Missing standalone dist/BZGoldExtractor.exe"
          }
          if (Test-Path "dist/BZGoldExtractor" -PathType Container) {
            throw "Unexpected onedir bundle dist/BZGoldExtractor"
          }
          Compress-Archive -Path "dist/BZGoldExtractor.exe" -DestinationPath "dist/Battlezone_Gold_Extractor-${{ steps.version.outputs.tag }}-windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Battlezone_Gold_Extractor-windows
          path: dist/Battlezone_Gold_Extractor-*-windows.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: "${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release): v')) }}"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/Battlezone_Gold_Extractor-v*-windows.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
