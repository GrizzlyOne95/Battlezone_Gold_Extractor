name: Windows EXE Release

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PACKAGE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci' }}
  WINDOWS_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy

      - name: Verify Python sources and generate Windows metadata
        shell: pwsh
        run: |
          python -m compileall tools scripts
          python scripts/generate_version_info.py --version "${env:WINDOWS_VERSION}" --output branding/version_info.txt

      - name: Build one-file Windows EXE
        shell: pwsh
        run: |
          ./tools/build-standalone.ps1 -PythonExe python -DistDir dist -OneFile:$true -Windowed:$true -BundleBms:$true -VersionFile branding/version_info.txt

      - name: Verify and package EXE output
        shell: pwsh
        run: |
          if (!(Test-Path "dist/BZGoldExtractor.exe")) {
            throw "Missing dist/BZGoldExtractor.exe"
          }
          Compress-Archive -Path "dist/BZGoldExtractor.exe" -DestinationPath "dist/Battlezone_Gold_Extractor-${env:PACKAGE_VERSION}-windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Battlezone_Gold_Extractor-windows
          path: dist/Battlezone_Gold_Extractor-*-windows.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Battlezone_Gold_Extractor-v*-windows.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
